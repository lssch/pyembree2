stages:
  - linting
  - build
  - test
  - secret-detection

variables:
  SECRET_DETECTION_ENABLED: 'true'
  DEFAULT_PYTHON: "3.14"
  GIT_DEPTH: 0
  CIBW_BUILD_VERBOSITY: "1"

ruff:
  stage: linting
  image: python:$DEFAULT_PYTHON
  script:
    - python -m pip install --upgrade pip
    - pip install ruff
    - ruff check

.wheels:
  stage: build
  script:
    - uv pip install cibuildwheel==3.4.1
    - uv cibuildwheel --output-dir dist
  artifacts:
    paths:
      - dist/*.whl
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

wheels:linux:
  extends: .wheels
  image: python:$DEFAULT_PYTHON
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - python -m pip install --upgrade pip
    - apt-get update
    - apt-get install -y docker.io
    - docker --version
    - docker info
  tags:
    - saas-linux-medium-amd64

pytest:sanity:
  stage: test
  needs:
    - job: wheels:linux
      artifacts: true
  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
  image: python:$PYTHON_VERSION
  before_script:
    - python -m pip install --upgrade pip
  script:
    - pip install --system dist/*.whl
    - pip install --system pytest
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

secret_detection:
  stage: secret-detection

include:
- template: Security/Secret-Detection.gitlab-ci.yml
