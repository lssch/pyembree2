[build-system]
requires = [
    "scikit-build-core>=0.11",
    "pybind11>=2.10",
    "setuptools_scm>=8",
]
build-backend = "scikit_build_core.build"

[project]
name = "pyembree2"
dynamic = ["version"]
description = "Pyembree2: Yet another incomplete Python wrapper for Embree, a high-performance ray tracing library from Intel"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Lars Schwarz", email = "lars.schwarz@fhgr.ch" },
    { name = "Philipp Roebrock", email = "philipp.roebrock@fhgr.ch" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
test = [
    "pytest",
    "trimesh[easy]",
]
dev = [
    "pytest",
    "trimesh[easy]",
    "ruff",
    "pre-commit",
    "cibuildwheel"
]

[project.urls]
Homepage = "https://gitlab.com/lssch/pyembree2"
Issues = "https://gitlab.com/lssch/pyembree2/issues"

[tool.setuptools_scm]
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+.*)$"
version_scheme = "release-branch-semver"
local_scheme = "no-local-version"
write_to = "src/pyembree2/_version.py"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/pyembree2"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*i686 *-win32 *musllinux*"

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel && python {project}\\package\\fetch-embree.py --install embree4"
repair-wheel-command = "delvewheel repair --add-path embree4\\bin --no-mangle tbb12.dll;embree4.dll -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "13.0" }
repair-wheel-command = "DYLD_LIBRARY_PATH=embree4/lib delocate-listdeps -a {wheel} && DYLD_LIBRARY_PATH=embree4/lib delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.linux]
repair-wheel-command = "LD_LIBRARY_PATH=`realpath embree4/lib`; auditwheel repair -w {dest_dir} {wheel}"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E203",  # black compatibility
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
